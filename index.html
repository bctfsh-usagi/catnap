<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>캣냅 정렬 — Cat Nap Sort</title>
<meta name="theme-color" content="#F6E9DC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="캣냅 정렬">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
:root{
  --ink:#5A4636; --sub:#A08B76; --accent:#E8743C; --lock:#7FB59B;
  --surface:#FFFDF8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  position:fixed;inset:0;overscroll-behavior:none;
  font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color:var(--ink);display:flex;justify-content:center;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;background:#F6E9DC;
}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center top}
#bg::after{content:"";position:absolute;inset:0;background:rgba(255,248,238,.18)} /* warm cream veil */

#app{
  width:100%;max-width:560px;height:100%;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ── HUD ── */
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 2px;flex:none}
.hud-left{display:flex;align-items:baseline;gap:9px;background:rgba(255,253,248,.82);padding:5px 13px;border-radius:14px;box-shadow:0 2px 0 rgba(90,70,54,.12)}
.lv-label{font-size:10px;letter-spacing:.14em;color:var(--sub);font-weight:800}
.lv-num{font-size:24px;font-weight:900}
.moves{font-size:11px;color:var(--sub)}
.moves b{color:var(--ink);font-size:13px}
.hud-right{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border:none;border-radius:14px;cursor:pointer;background:rgba(255,253,248,.9);box-shadow:0 2px 0 rgba(90,70,54,.15);display:flex;align-items:center;justify-content:center;transition:transform .08s;padding:9px}
.icon-btn img{width:100%;height:100%;object-fit:contain}
.icon-btn:active{transform:translateY(2px);box-shadow:none}

.tut{text-align:center;font-size:13px;color:var(--ink);padding:3px 16px 0;flex:none;min-height:21px;font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.tut strong{color:var(--accent)}

/* ── 보드 ── */
#board{
  flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
  gap:18px 12px;padding:10px 8px 14px;overflow-y:auto;
}
.basket{position:relative;cursor:pointer;flex:none;transition:transform .12s}
.basket.sel{transform:translateY(-4px)}
.basket.can{filter:drop-shadow(0 0 6px rgba(127,181,155,.6)) drop-shadow(0 0 14px rgba(127,181,155,.3))}
.basket.can::after{
  content:"";position:absolute;left:50%;top:-14px;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--lock);animation:bob .7s infinite;
}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
/* dim: 색 판독성 유지 — 바구니만 뒤로, 고양이는 0.85 유지 */
.basket.dim .bk-back,.basket.dim .bk-front{opacity:.7;filter:saturate(.78) brightness(.97)}
.basket.dim .cat{opacity:.85}
.basket.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.basket.hint-src{filter:drop-shadow(0 0 8px rgba(232,116,60,.85))}
.basket.hint-dst{filter:drop-shadow(0 0 8px rgba(127,181,155,.85))}
.basket.lock-pop{animation:lockPop .32s ease-out}
@keyframes lockPop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}

/* 바구니를 고양이보다 한 단계 뒤로 */
.bk-back,.bk-front{filter:saturate(.84) brightness(1.03)}
.bk-back{position:absolute;bottom:0;left:0;width:100%;z-index:1;pointer-events:none}
.bk-front{position:absolute;bottom:0;left:0;width:100%;z-index:30;pointer-events:none}
.bk-back img,.bk-front img,.cat img{width:100%;height:100%;object-fit:contain;display:block}

.cat{
  position:absolute;z-index:10;pointer-events:none;
  transition:left .18s ease, bottom .18s ease, width .18s ease, transform .16s ease;
  filter:drop-shadow(0 2px 2px rgba(90,70,54,.2));
}
.cat.top-sel{transform:translateY(-12px) scale(1.04);z-index:31}
.cat img.pop{animation:pop .26s}
@keyframes pop{0%{transform:scale(.72)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.cat img.sleep-in{animation:sleepIn .34s ease-out}
@keyframes sleepIn{0%{transform:scale(.86)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
.img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px}

.basket.locked{cursor:default}
/* Zzz — 바구니당 1개, 3단 상승 */
.zzz{position:absolute;top:2px;right:9%;z-index:40;pointer-events:none;width:34px;height:30px}
.zzz i{position:absolute;font-style:normal;font-weight:800;color:#FFF3D6;text-shadow:0 1px 3px rgba(90,70,54,.45);opacity:0;animation:zrise 2.2s ease-in-out infinite}
.zzz i:nth-child(1){font-size:17px;right:0;bottom:0}
.zzz i:nth-child(2){font-size:13px;right:14px;bottom:6px;animation-delay:.4s}
.zzz i:nth-child(3){font-size:10px;right:24px;bottom:12px;animation-delay:.8s}
@keyframes zrise{0%{opacity:0;transform:translateY(2px)}25%{opacity:.9}70%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}
.sparkle{position:absolute;font-size:14px;color:#FFE9A8;text-shadow:0 0 6px rgba(255,220,140,.85);z-index:45;pointer-events:none;animation:sparkleUp .9s ease-out forwards}
@keyframes sparkleUp{0%{opacity:0;transform:translateY(4px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1.1)}}

#finger{position:fixed;z-index:80;font-size:34px;pointer-events:none;display:none;animation:tapAnim .8s infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes tapAnim{0%,100%{transform:translate(-30%,-10%) scale(1)}50%{transform:translate(-30%,-10%) scale(.82)}}

/* ── 오버레이 ── */
.overlay{position:fixed;inset:0;background:rgba(90,70,54,.45);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.panel{background:var(--surface);border-radius:26px;padding:0 0 22px;width:min(330px,88vw);text-align:center;box-shadow:0 8px 0 rgba(90,70,54,.25);overflow:hidden;transform:translateY(14px);transition:transform .25s}
.overlay.show .panel{transform:translateY(0)}
.panel .art{width:100%;height:150px;object-fit:cover;object-position:center 30%;display:block;margin-bottom:14px}
.panel .big{font-size:40px;line-height:1;margin:20px 0 6px}
.panel h2{font-size:21px;font-weight:800;margin-bottom:6px}
.panel p{font-size:13.5px;color:var(--sub);margin-bottom:16px;line-height:1.65;padding:0 24px}
.btn{display:block;width:calc(100% - 48px);margin:0 auto 10px;padding:13px;border:none;border-radius:16px;cursor:pointer;font-size:15px;font-weight:800;font-family:inherit;background:var(--accent);color:#fff;box-shadow:0 3px 0 #C05A28;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:#EFE7DA;color:var(--ink);box-shadow:0 3px 0 #D9CDBB}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:rgba(90,70,54,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;z-index:110;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{flex:none;display:flex;gap:10px;justify-content:center;padding:6px 16px calc(14px + env(safe-area-inset-bottom)/2)}
.tool{min-width:118px;min-height:44px;padding:8px 10px;border:none;border-radius:16px;cursor:pointer;background:rgba(255,253,248,.92);box-shadow:0 3px 0 rgba(90,70,54,.18);font-family:inherit;font-size:12.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s}
.tool img{width:26px;height:26px;object-fit:contain}
.tool:active{transform:translateY(2px);box-shadow:none}

/* ── 타이틀 ── */
#titleScreen{
  position:fixed;inset:0;z-index:200;background-size:cover;background-position:center 30%;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(9vh + env(safe-area-inset-top)) 24px calc(7vh + env(safe-area-inset-bottom));
  transition:opacity .5s;
}
#titleScreen::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,238,.35) 0%,rgba(255,248,238,0) 30%,rgba(90,70,54,0) 62%,rgba(90,70,54,.55) 100%);pointer-events:none}
#titleScreen.hide{opacity:0;pointer-events:none}
.logo{position:relative;text-align:center;animation:logoBob 3s ease-in-out infinite}
@keyframes logoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.logo h1{font-size:clamp(42px,12vw,60px);font-weight:900;letter-spacing:.02em;color:#FFF9F0;text-shadow:0 3px 0 #B9884B,0 6px 14px rgba(90,70,54,.45),-2px -2px 0 #8A6437,2px -2px 0 #8A6437,-2px 2px 0 #8A6437,2px 2px 0 #8A6437}
.logo .en{font-size:13px;letter-spacing:.34em;font-weight:800;color:#FFF3E2;text-shadow:0 1px 3px rgba(90,70,54,.6);margin-top:2px}
.logo .zz{position:absolute;top:-26px;right:-14px;font-size:24px;font-weight:800;color:#FFF9F0;text-shadow:0 2px 4px rgba(90,70,54,.5);animation:zfloatT 2s ease-in-out infinite}
@keyframes zfloatT{0%{transform:translateY(0);opacity:.95}50%{transform:translateY(-7px);opacity:.55}100%{transform:translateY(0);opacity:.95}}
.title-bottom{position:relative;width:100%;max-width:320px;text-align:center}
.title-sub{font-size:14px;color:#FFF3E2;font-weight:700;text-shadow:0 1px 3px rgba(90,70,54,.7);margin-bottom:16px}
#btnStart{width:100%;padding:17px;border:none;border-radius:20px;cursor:pointer;font-family:inherit;font-size:18px;font-weight:900;letter-spacing:.04em;background:var(--accent);color:#fff;box-shadow:0 4px 0 #C05A28,0 8px 18px rgba(90,70,54,.35);transition:transform .08s;animation:startPulse 1.6s ease-in-out infinite}
@keyframes startPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#btnStart:active{transform:translateY(3px);box-shadow:0 1px 0 #C05A28}
.title-ver{margin-top:12px;font-size:10.5px;color:rgba(255,243,226,.85);letter-spacing:.1em}
</style>
</head>
<body>
<div id="bg"></div>

<div id="titleScreen">
  <div class="logo">
    <span class="zz">Z z</span>
    <h1>캣냅 정렬</h1>
    <div class="en">CAT NAP SORT</div>
  </div>
  <div class="title-bottom">
    <div class="title-sub">같은 색 고양이를 모아 포근하게 재워 주세요</div>
    <button id="btnStart">재우러 가기 🐾</button>
    <div class="title-ver">v0.5.1 · INTERNAL BUILD</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="hud-left">
      <span><span class="lv-label">LEVEL </span><span class="lv-num" id="lvNum">1</span></span>
      <span class="moves">이동 <b id="moveCount">0</b></span>
    </div>
    <div class="hud-right">
      <button class="icon-btn" id="btnSound"><img id="sndIcon" alt="소리"></button>
      <button class="icon-btn" id="btnRestart"><img id="rstIcon" alt="재시작"></button>
    </div>
  </header>

  <div class="tut" id="tut"></div>
  <main id="board"></main>

  <footer>
    <button class="tool" id="btnUndo"><img id="undoIcon" alt="">되돌리기</button>
    <!-- 힌트 = 보상형 광고 연결 지점 (SDK 연동 시 modal 안내 구조로) -->
    <button class="tool" id="btnHint"><img id="hintIcon" alt="">츄르 찬스</button>
  </footer>
</div>

<div id="finger">👆</div>

<div class="overlay" id="ovWin">
  <div class="panel">
    <img class="art" id="winArt" alt="">
    <h2>모두 새근새근 잠들었어요</h2>
    <p id="winStats"></p>
    <button class="btn" id="btnNext">다음 레벨 →</button>
  </div>
</div>

<div class="overlay" id="ovStuck">
  <div class="panel">
    <div class="big">🐈</div>
    <h2>고양이들이 갈 곳을 몰라요</h2>
    <p>괜찮아요, 고양이들은 급할 게 없대요.<br>천천히 다시 해볼까요?</p>
    <button class="btn" id="btnStuckUndo">한 수 되돌리기</button>
    <button class="btn ghost" id="btnStuckRestart">처음부터 다시</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================================
   캣냅 정렬 v0.5 — AD 스펙 P0+P1 반영
   코어 로직(생성기/솔버/이동 규칙)은 v0.3과 동일, 렌더링/연출만 개편
   ========================================================================= */

/* ── ASSET MAP (상대경로) ── */
const ASSETS={
  cats:{}, baskets:{}, ui:{}, backgrounds:{
    main:'./bg_main.jpg',
    terrace:'./bg_terrace.jpg',
    night:'./bg_night.jpg'
  },
  marketing:{keyart:'./marketing_keyart.jpg'}
};
const COLORS=['orange','gray','brown','black','pink','cream','mint'];
COLORS.forEach(c=>{ASSETS.cats[c]={idle:`./cat_${c}_idle.png`,sleep:`./cat_${c}_sleep.png`}});
[2,3,4].forEach(n=>{ASSETS.baskets[n]={back:`./basket_${n}_back.png`,front:`./basket_${n}_front.png`}});
['undo','hint','restart','sound_on','sound_off','clear'].forEach(n=>{ASSETS.ui[n]=`./ui_${n}.png`});

/* ── 렌더 상수 (실측 기반) ── */
const SLOTS={2:[0.305,0.688],3:[0.216,0.492,0.774],4:[0.166,0.383,0.606,0.826]}; // 방석 중심 실측값
const BACK_ASPECT={2:0.8505,3:0.5922,4:0.4669};   // 뒷면 이미지 h/w
const IDLE_AR=250/344, SLEEP_AR=276/212;          // 캔버스 w/h
const FRONT_RATIO=0.46;                            // 앞벽 높이 = 뒷면 높이 × 0.46
const BURY_IDLE=0.27, BURY_SLEEP=0.14;             // 매몰 비율 (AD 스펙 4장)

/* ── 정적 UI 바인딩 ── */
document.getElementById('titleScreen').style.backgroundImage=`url(${ASSETS.marketing.keyart})`;
document.getElementById('winArt').src=ASSETS.marketing.keyart;
document.getElementById('undoIcon').src=ASSETS.ui.undo;
document.getElementById('hintIcon').src=ASSETS.ui.hint;
document.getElementById('rstIcon').src=ASSETS.ui.restart;
document.getElementById('sndIcon').src=ASSETS.ui.sound_on;

/* 레벨별 배경 테마 */
function backgroundForLevel(lv){
  const m=((lv-1)%60)+1;
  return m<=20?ASSETS.backgrounds.main : m<=40?ASSETS.backgrounds.terrace : ASSETS.backgrounds.night;
}

/* 프리로드 */
(function preload(){
  const list=[];
  COLORS.forEach(c=>{list.push(ASSETS.cats[c].idle,ASSETS.cats[c].sleep)});
  [2,3,4].forEach(n=>{list.push(ASSETS.baskets[n].back,ASSETS.baskets[n].front)});
  Object.values(ASSETS.ui).forEach(u=>list.push(u));
  Object.values(ASSETS.backgrounds).forEach(u=>list.push(u));
  list.push(ASSETS.marketing.keyart);
  list.forEach(s=>{const i=new Image();i.src=s});
})();

/* graceful fallback */
function withFallback(img,glyph){
  img.onerror=function(){
    if(glyph===null){this.remove();return}
    const d=document.createElement('div');d.className='img-fallback';d.textContent=glyph;
    this.replaceWith(d);
  };
  return img;
}

/* ── 코어 로직 (변경 없음) ── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function levelConfig(lv,rnd){
  const colors=Math.min(3+Math.floor((lv-1)/2),7);
  const caps=[];
  for(let i=0;i<colors;i++){ if(lv<3) caps.push(3); else caps.push([2,3,3,4][Math.floor(rnd()*4)]); }
  const empties = lv<6 ? [3,3] : (lv<10 ? [3,2] : [2,2]);
  return {caps, empties};
}
function isFullUniform(st,cap){return st.length===cap && st.every(c=>c===st[0])}
function topGroup(st){if(!st.length)return 0;const c=st[st.length-1];let n=0;for(let i=st.length-1;i>=0&&st[i]===c;i--)n++;return n}
function legalMoves(stacks,caps){
  const mv=[];
  for(let i=0;i<stacks.length;i++){
    const s=stacks[i];
    if(!s.length||isFullUniform(s,caps[i]))continue;
    const color=s[s.length-1], g=topGroup(s);
    for(let j=0;j<stacks.length;j++){
      if(i===j)continue;
      const d=stacks[j];
      if(isFullUniform(d,caps[j]))continue;
      const space=caps[j]-d.length;
      if(space<=0)continue;
      if(d.length&&d[d.length-1]!==color)continue;
      if(!d.length&&g===s.length)continue;
      mv.push([i,j,Math.min(g,space)]);
    }
  }
  return mv;
}
function isSolved(stacks,caps){return stacks.every((s,i)=>!s.length||isFullUniform(s,caps[i]))}
function keyOf(stacks,caps){return stacks.map((s,i)=>caps[i]+':'+s.join(',')).slice().sort().join('|')}
function solve(stacks,caps,nodeCap=60000){
  const visited=new Set();let nodes=0;
  function dfs(st,path){
    if(isSolved(st,caps))return path;
    if(++nodes>nodeCap)return null;
    const k=keyOf(st,caps);
    if(visited.has(k))return null;
    visited.add(k);
    const mv=legalMoves(st,caps);
    mv.sort((a,b)=>{
      const sc=m=>{const[i,j]=m;const d=st[j];const same=d.length&&st[i][st[i].length-1]===d[d.length-1];return (same?2:0)+(caps[j]-d.length===m[2]?1:0)};
      return sc(b)-sc(a);
    });
    for(const m of mv){
      const ns=st.map(s=>s.slice());
      const moved=ns[m[0]].splice(ns[m[0]].length-m[2],m[2]);
      ns[m[1]].push(...moved);
      const r=dfs(ns,path.concat([m]));
      if(r)return r;
    }
    return null;
  }
  return dfs(stacks,[]);
}
function generateLevel(lv){
  for(let attempt=0;attempt<60;attempt++){
    const rnd=mulberry32(lv*7919+attempt*104729+13);
    const cfg=levelConfig(lv,rnd);
    const cats=[];
    cfg.caps.forEach((cap,ci)=>{for(let k=0;k<cap;k++)cats.push(ci)});
    shuffle(cats,rnd);
    const stacks=[];let p=0;
    for(const cap of cfg.caps){stacks.push(cats.slice(p,p+cap));p+=cap}
    for(const _ of cfg.empties)stacks.push([]);
    const caps=cfg.caps.concat(cfg.empties);
    if(stacks.some((s,i)=>isFullUniform(s,caps[i])))continue;
    if(isSolved(stacks,caps))continue;
    const sol=solve(stacks.map(s=>s.slice()),caps);
    if(sol&&sol.length>=3)return{stacks,caps,par:sol.length};
  }
  return generateLevel(Math.max(1,lv-1));
}

/* ── 사운드 ── */
let audioCtx=null,soundOn=true;
function blip(freq,dur=0.09,type='sine',vol=0.15){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function purr(){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),l=audioCtx.createOscillator(),lg=audioCtx.createGain();
    o.type='triangle';o.frequency.value=58;
    l.type='sine';l.frequency.value=13; lg.gain.value=22;
    l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.11,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.3);
    o.connect(g).connect(audioCtx.destination);
    o.start();l.start();o.stop(audioCtx.currentTime+1.3);l.stop(audioCtx.currentTime+1.3);
  }catch(e){}
}
const sfx={
  pick:()=>blip(660,0.07,'triangle'),
  move:()=>{blip(440,0.06);setTimeout(()=>blip(560,0.07),50)},
  lock:()=>{blip(523,0.1,'sine',0.18);setTimeout(()=>blip(659,0.12,'sine',0.18),90);setTimeout(()=>blip(784,0.2,'sine',0.18),180);setTimeout(purr,300)},
  bad:()=>blip(180,0.12,'square',0.07),
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'sine',0.18),i*110));setTimeout(purr,500)},
};

/* ── 게임 상태 ── */
let level=1, stacks=[], caps=[], par=0;
let selected=-1, moves=0, history=[], hintTimer=null;
let tutMoves=null, tutStep=0, tipShown=false;
let pendingLock=-1;   // 완성 연출 진행 중인 바구니 (연출 끝날 때까지 idle로 렌더)

const $=id=>document.getElementById(id);
const board=$('board');

/* ── 크기 계산 (고양이 +12% 반영) ── */
function catWidth(){
  const n=caps.length;
  const vw=Math.min(window.innerWidth,560);
  const base = n<=5 ? 70 : (n<=7 ? 63 : 56);
  return Math.min(base, Math.floor((vw-28)/4.23));
}
function geoFor(cap,cw){
  const bw=Math.round(cw*(cap*0.92+0.55));
  const backH=Math.round(bw*BACK_ASPECT[cap]);
  const frontH=Math.round(backH*FRONT_RATIO);
  const idleW=cw, idleH=Math.round(cw/IDLE_AR);
  const sleepW=Math.round(cw*1.18), sleepH=Math.round(sleepW/SLEEP_AR);
  const bIdle=Math.max(2, Math.round(frontH - BURY_IDLE*idleH));
  const bSleep=Math.max(2, Math.round(frontH - BURY_SLEEP*sleepH));
  const slots=SLOTS[cap].map(f=>Math.round(f*bw));
  return {bw,backH,frontH,idleW,idleH,sleepW,sleepH,bIdle,bSleep,slots,
          height:Math.max(backH, bIdle+idleH+14)};
}

function loadLevel(lv){
  const g=generateLevel(lv);
  stacks=g.stacks;caps=g.caps;par=g.par;
  selected=-1;moves=0;history=[];tipShown=false;pendingLock=-1;
  $('lvNum').textContent=lv;
  $('moveCount').textContent='0';
  $('bg').style.backgroundImage=`url(${backgroundForLevel(lv)})`;
  $('tut').innerHTML= lv===1
    ? `<strong>같은 색 고양이</strong>를 한 바구니에 모아 재워 주세요`
    : (lv===3 ? `바구니마다 <strong>방석 수</strong>가 달라요 — 어디에 재울지 배분이 전략!` : '');
  if(lv===1){ tutMoves = solve(stacks.map(s=>s.slice()),caps)?.slice(0,2) || null; tutStep=0; }
  else { tutMoves=null; hideFinger(); }
  render();
  if(tutMoves && !document.getElementById('titleScreen')) setTimeout(()=>fingerOn(tutMoves[0][0]),400);
}

function catImg(colorIdx,pose){
  const img=new Image();
  img.src=ASSETS.cats[COLORS[colorIdx]][pose];
  img.draggable=false;
  return withFallback(img,'🐱');
}

function render(){
  clearHint();
  board.innerHTML='';
  const cw=catWidth();
  stacks.forEach((s,i)=>{
    const cap=caps[i];
    const G=geoFor(cap,cw);
    const locked=isFullUniform(s,cap);
    const showSleep = locked && i!==pendingLock;
    const b=document.createElement('div');
    b.className='basket';
    if(locked)b.classList.add('locked');
    if(i===selected)b.classList.add('sel');
    b.style.width=G.bw+'px';
    b.style.height=G.height+'px';
    b._geo=G;

    const back=document.createElement('div');
    back.className='bk-back';back.style.height=G.backH+'px';
    back.appendChild(withFallback((()=>{const m=new Image();m.src=ASSETS.baskets[cap].back;return m})(),'🧺'));
    b.appendChild(back);

    const g=topGroup(s);
    s.forEach((c,idx)=>{
      const w=showSleep?G.sleepW:G.idleW;
      const cat=document.createElement('div');
      cat.className='cat';
      cat.style.width=w+'px';
      cat.style.height=(showSleep?G.sleepH:G.idleH)+'px';
      cat.style.left=(G.slots[idx]-Math.round(w/2))+'px';
      cat.style.bottom=(showSleep?G.bSleep:G.bIdle)+'px';
      cat.style.zIndex=10+idx;
      if(!locked && i===selected && idx>=s.length-g) cat.classList.add('top-sel');
      cat.appendChild(catImg(c, showSleep?'sleep':'idle'));
      b.appendChild(cat);
    });

    const front=document.createElement('div');
    front.className='bk-front';front.style.height=G.frontH+'px';
    front.appendChild(withFallback((()=>{const m=new Image();m.src=ASSETS.baskets[cap].front;return m})(),null));
    b.appendChild(front);

    if(showSleep) b.appendChild(makeZzz());
    b.addEventListener('pointerdown',()=>tapBasket(i,b));
    board.appendChild(b);
  });
  markTargets();
}
function makeZzz(){
  const z=document.createElement('span');z.className='zzz';
  z.innerHTML='<i>Z</i><i>z</i><i>·</i>';
  return z;
}

/* ── 완성 연출 (AD 스펙 11장 타임라인) ── */
function playLockJuice(bi){
  const seq=(t,fn)=>setTimeout(()=>{const bEl=board.children[bi]; if(bEl)fn(bEl)},t);
  seq(80, bEl=>bEl.classList.add('lock-pop'));
  const count=stacks[bi].length;
  for(let idx=0;idx<count;idx++){
    seq(150+idx*90, bEl=>{
      const G=bEl._geo;
      const cat=bEl.querySelectorAll('.cat')[idx];
      if(!cat)return;
      cat.style.width=G.sleepW+'px';
      cat.style.height=G.sleepH+'px';
      cat.style.left=(G.slots[idx]-Math.round(G.sleepW/2))+'px';
      cat.style.bottom=G.bSleep+'px';
      const img=cat.querySelector('img');
      if(img){img.src=ASSETS.cats[COLORS[stacks[bi][idx]]].sleep;img.classList.add('sleep-in')}
    });
  }
  seq(380, bEl=>{
    [[0.28,0.18],[0.68,0.10]].forEach(([fx,fy])=>{
      const sp=document.createElement('span');sp.className='sparkle';sp.textContent='✦';
      sp.style.left=Math.round(bEl._geo.bw*fx)+'px';
      sp.style.top=Math.round(bEl._geo.height*fy)+'px';
      bEl.appendChild(sp);
      setTimeout(()=>sp.remove(),950);
    });
  });
  seq(430, bEl=>{
    if(!bEl.querySelector('.zzz')) bEl.appendChild(makeZzz());
    pendingLock=-1;
  });
}

function markTargets(){
  const els=[...board.children];
  els.forEach(el=>el.classList.remove('can','dim'));
  if(selected===-1)return;
  const s=stacks[selected], color=s[s.length-1];
  els.forEach((el,j)=>{
    if(j===selected)return;
    const d=stacks[j];
    if(isFullUniform(d,caps[j])){el.classList.add('dim');return}
    const space=caps[j]-d.length;
    const ok = space>0 && (!d.length||d[d.length-1]===color);
    el.classList.add(ok?'can':'dim');
  });
}

function tapBasket(i,el){
  if(isFullUniform(stacks[i],caps[i])){toast('이미 새근새근 자고 있어요 💤');return}
  if(selected===-1){
    if(!stacks[i].length){toast('빈 바구니예요 — 고양이가 있는 곳을 먼저!');shakeEl(el);return}
    selected=i;sfx.pick();render();
    if(level===1&&!tipShown){toast('맨 오른쪽 친구부터 옮길 수 있어요 🐾');tipShown=true}
    advanceTut(1,i);
    return;
  }
  if(selected===i){selected=-1;render();return}
  attemptMove(selected,i,el);
}

function attemptMove(from,to,el){
  const s=stacks[from],d=stacks[to];
  const color=s[s.length-1],g=topGroup(s),space=caps[to]-d.length;
  if(space<=0){toast('이 바구니는 방석이 다 찼어요!');shakeEl(el);sfx.bad();selected=-1;render();return}
  if(d.length&&d[d.length-1]!==color){toast('색이 다른 친구 옆엔 안 앉는대요 🐾');shakeEl(el);sfx.bad();selected=-1;render();return}
  history.push({stacks:stacks.map(x=>x.slice()),moves});
  const m=Math.min(g,space);
  const movedCats=s.splice(s.length-m,m);
  d.push(...movedCats);
  moves++;$('moveCount').textContent=moves;
  selected=-1;
  const nowLocked=isFullUniform(d,caps[to]);
  if(nowLocked){pendingLock=to;sfx.lock()}else{sfx.move()}
  render();
  const bEl=board.children[to];
  if(bEl && !nowLocked){[...bEl.querySelectorAll('.cat img')].slice(-m).forEach(c=>c.classList.add('pop'))}
  if(nowLocked) playLockJuice(to);
  advanceTut(2,to);
  checkEnd();
}

function fingerOn(basketIdx){
  const el=board.children[basketIdx];
  if(!el)return;
  const r=el.getBoundingClientRect();
  const f=$('finger');
  f.style.display='block';
  f.style.left=(r.left+r.width/2)+'px';
  f.style.top=(r.top+r.height*0.5)+'px';
}
function hideFinger(){$('finger').style.display='none'}
function advanceTut(phase,idx){
  if(!tutMoves||tutStep>=tutMoves.length)return;
  const [src,dst]=tutMoves[tutStep];
  if(phase===1){
    if(idx===src){fingerOn(dst)} else hideFinger();
  }else{
    tutStep++;
    hideFinger();
    if(tutStep<tutMoves.length){
      const sol=solve(stacks.map(s=>s.slice()),caps);
      if(sol&&sol.length){tutMoves=[sol[0]];tutStep=0;setTimeout(()=>fingerOn(sol[0][0]),350)}
      else tutMoves=null;
    }else tutMoves=null;
  }
}

function shakeEl(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),320)}

function checkEnd(){
  if(isSolved(stacks,caps)){
    sfx.win();hideFinger();
    $('winStats').innerHTML=`이동 <b>${moves}</b>수 · 참고 최단 ${par}수<br>골골골… 🐾`;
    setTimeout(()=>$('ovWin').classList.add('show'),1100);  // 잠드는 연출 감상 후 팝업
    return;
  }
  if(legalMoves(stacks,caps).length===0){
    setTimeout(()=>$('ovStuck').classList.add('show'),450);
  }
}

function undo(){
  if(!history.length){toast('되돌릴 수가 없어요');return}
  const h=history.pop();
  stacks=h.stacks;moves=h.moves;pendingLock=-1;
  $('moveCount').textContent=moves;selected=-1;
  $('ovStuck').classList.remove('show');
  render();
}
function hint(){
  const sol=solve(stacks.map(s=>s.slice()),caps);
  if(!sol||!sol.length){toast('여기서는 길이 없어요 — 되돌려 보세요');return}
  const[from,to]=sol[0];
  clearHint();
  const els=board.children;
  els[from]&&els[from].classList.add('hint-src');
  els[to]&&els[to].classList.add('hint-dst');
  toast('🍡 주황 빛 바구니에서 → 초록 빛 바구니로!');
  hintTimer=setTimeout(clearHint,2600);
}
function clearHint(){
  if(hintTimer){clearTimeout(hintTimer);hintTimer=null}
  [...board.children].forEach(el=>el.classList.remove('hint-src','hint-dst'));
}
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);
}

$('btnUndo').onclick=undo;
$('btnHint').onclick=hint;
$('btnRestart').onclick=()=>loadLevel(level);
$('btnNext').onclick=()=>{$('ovWin').classList.remove('show');level++;loadLevel(level)};
$('btnStuckUndo').onclick=()=>{$('ovStuck').classList.remove('show');undo()};
$('btnStuckRestart').onclick=()=>{$('ovStuck').classList.remove('show');loadLevel(level)};
$('btnSound').onclick=function(){soundOn=!soundOn;$('sndIcon').src=soundOn?ASSETS.ui.sound_on:ASSETS.ui.sound_off};
window.addEventListener('resize',()=>{render(); if(tutMoves&&tutStep<tutMoves.length)fingerOn(tutMoves[tutStep][0])});

document.getElementById('btnStart').addEventListener('click',()=>{
  const t=document.getElementById('titleScreen');
  t.classList.add('hide');
  sfx.pick();
  setTimeout(()=>t.remove(),550);
  if(tutMoves) setTimeout(()=>fingerOn(tutMoves[0][0]),600);
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

loadLevel(level);
</script>
</body>
