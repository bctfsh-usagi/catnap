<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>캣냅 정렬 — 프로토타입 v0.4</title>
<meta name="theme-color" content="#F6E9DC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="캣냅 정렬">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<style>
:root{ --ink:#5A4636; --sub:#A08B76; --accent:#E8743C; --lock:#7FB59B; --white:#FFFDF8; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  position:fixed;inset:0;overscroll-behavior:none;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;background:#F6E9DC;
}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center top}
#bg::after{content:"";position:absolute;inset:0;background:rgba(255,250,244,.28)}

header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px;flex:none}
.hud-left{display:flex;align-items:baseline;gap:10px;background:rgba(255,253,248,.85);padding:6px 14px;border-radius:16px;box-shadow:0 2px 0 rgba(90,70,54,.12)}
.lv-label{font-size:10px;letter-spacing:.16em;color:var(--sub);font-weight:800}
.lv-num{font-size:22px;font-weight:800}
.moves{font-size:11.5px;color:var(--sub)}
.moves b{color:var(--ink);font-size:14px}
.hud-right{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border:none;border-radius:15px;cursor:pointer;background:rgba(255,253,248,.9);box-shadow:0 2px 0 rgba(90,70,54,.15);display:flex;align-items:center;justify-content:center;transition:transform .08s;padding:8px}
.icon-btn img{width:100%;height:100%;object-fit:contain}
.icon-btn:active{transform:translateY(2px);box-shadow:none}

.tut{text-align:center;font-size:13px;color:var(--ink);padding:4px 16px 0;flex:none;min-height:22px;font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.tut strong{color:var(--accent)}

#board{
  flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
  gap:16px 10px;padding:10px 8px 14px;overflow-y:auto;
}
.basket{position:relative;cursor:pointer;flex:none;transition:transform .12s}
.basket.sel{transform:translateY(-4px)}
.basket.can{filter:drop-shadow(0 0 8px rgba(127,181,155,.95))}
.basket.can::after{
  content:"";position:absolute;left:50%;top:-15px;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--lock);animation:bob .7s infinite;
}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
.basket.dim{opacity:.5}
.basket.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.basket.hint-src{filter:drop-shadow(0 0 9px rgba(232,116,60,.95))}
.basket.hint-dst{filter:drop-shadow(0 0 9px rgba(127,181,155,.95))}

.bk-back{position:absolute;bottom:0;left:0;width:100%;z-index:1;pointer-events:none}
.bk-front{position:absolute;bottom:0;left:0;width:100%;z-index:30;pointer-events:none;object-fit:fill}
.cat{
  position:absolute;z-index:10;pointer-events:none;
  transition:left .18s ease, bottom .18s ease, transform .16s ease;
  filter:drop-shadow(0 2px 2px rgba(90,70,54,.22));
}
.cat img{width:100%;display:block}
.cat.top-sel{transform:translateY(-16px) scale(1.06);z-index:31}
.cat.pop{animation:pop .26s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.basket.locked{cursor:default}
.zzz{position:absolute;top:14px;right:2px;font-size:16px;font-weight:800;color:#fff;z-index:40;text-shadow:0 1px 2px rgba(90,70,54,.5);animation:zfloat 2s ease-in-out infinite;pointer-events:none}
@keyframes zfloat{0%{transform:translateY(0);opacity:.95}50%{transform:translateY(-7px);opacity:.55}100%{transform:translateY(0);opacity:.95}}

#finger{position:fixed;z-index:80;font-size:34px;pointer-events:none;display:none;animation:tap .8s infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes tap{0%,100%{transform:translate(-30%,-10%) scale(1)}50%{transform:translate(-30%,-10%) scale(.82)}}

.overlay{position:fixed;inset:0;background:rgba(90,70,54,.45);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.panel{background:var(--white);border-radius:26px;padding:0 0 22px;width:min(330px,88vw);text-align:center;box-shadow:0 8px 0 rgba(90,70,54,.25);overflow:hidden;transform:translateY(14px);transition:transform .25s}
.overlay.show .panel{transform:translateY(0)}
.panel .art{width:100%;height:150px;object-fit:cover;object-position:center 28%;display:block;margin-bottom:14px}
.panel .big{font-size:40px;line-height:1;margin:20px 0 6px}
.panel h2{font-size:21px;font-weight:800;margin-bottom:6px}
.panel p{font-size:13.5px;color:var(--sub);margin-bottom:16px;line-height:1.65;padding:0 24px}
.btn{display:block;width:calc(100% - 48px);margin:0 auto 10px;padding:13px;border:none;border-radius:16px;cursor:pointer;font-size:15px;font-weight:800;font-family:inherit;background:var(--accent);color:#fff;box-shadow:0 3px 0 #C05A28;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:#EFE7DA;color:var(--ink);box-shadow:0 3px 0 #D9CDBB}
.ad-note{font-size:10.5px;color:var(--sub);margin:-4px 0 8px}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:rgba(90,70,54,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;z-index:110;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{flex:none;display:flex;gap:10px;justify-content:center;padding:6px 16px calc(16px + env(safe-area-inset-bottom)/2)}
.tool{width:112px;padding:9px 6px;border:none;border-radius:16px;cursor:pointer;background:rgba(255,253,248,.92);box-shadow:0 3px 0 rgba(90,70,54,.18);font-family:inherit;font-size:12px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .08s}
.tool img{width:30px;height:30px;object-fit:contain}
.tool:active{transform:translateY(2px);box-shadow:none}
.tool .adtag{font-size:9px;color:var(--accent);letter-spacing:.04em}

/* ── 타이틀 스크린 ── */
#titleScreen{
  position:fixed;inset:0;z-index:200;
  background-size:cover;background-position:center 30%;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(9vh + env(safe-area-inset-top)) 24px calc(7vh + env(safe-area-inset-bottom));transition:opacity .5s;
}
#titleScreen::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,248,238,.35) 0%,rgba(255,248,238,0) 30%,rgba(90,70,54,0) 62%,rgba(90,70,54,.55) 100%);
  pointer-events:none;
}
#titleScreen.hide{opacity:0;pointer-events:none}
.logo{position:relative;text-align:center;animation:logoBob 3s ease-in-out infinite}
@keyframes logoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.logo h1{
  font-size:clamp(42px,12vw,60px);font-weight:900;letter-spacing:.02em;color:#FFF9F0;
  text-shadow:0 3px 0 #B9884B, 0 6px 14px rgba(90,70,54,.45),
    -2px -2px 0 #8A6437, 2px -2px 0 #8A6437, -2px 2px 0 #8A6437, 2px 2px 0 #8A6437;
}
.logo .en{font-size:13px;letter-spacing:.34em;font-weight:800;color:#FFF3E2;text-shadow:0 1px 3px rgba(90,70,54,.6);margin-top:2px}
.logo .zz{position:absolute;top:-26px;right:-14px;font-size:24px;font-weight:800;color:#FFF9F0;text-shadow:0 2px 4px rgba(90,70,54,.5);animation:zfloat 2s ease-in-out infinite}
.title-bottom{position:relative;width:100%;max-width:320px;text-align:center}
.title-sub{font-size:14px;color:#FFF3E2;font-weight:700;text-shadow:0 1px 3px rgba(90,70,54,.7);margin-bottom:16px}
#btnStart{
  width:100%;padding:17px;border:none;border-radius:20px;cursor:pointer;
  font-family:inherit;font-size:18px;font-weight:900;letter-spacing:.04em;
  background:var(--accent);color:#fff;box-shadow:0 4px 0 #C05A28, 0 8px 18px rgba(90,70,54,.35);
  transition:transform .08s;animation:startPulse 1.6s ease-in-out infinite;
}
@keyframes startPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#btnStart:active{transform:translateY(3px);box-shadow:0 1px 0 #C05A28}
.title-ver{margin-top:12px;font-size:10.5px;color:rgba(255,243,226,.85);letter-spacing:.1em}

</style>
</head>
<body>
<div id="bg"></div>
<div id="titleScreen">
  <div class="logo">
    <span class="zz">Z z</span>
    <h1>캣냅 정렬</h1>
    <div class="en">CAT NAP SORT</div>
  </div>
  <div class="title-bottom">
    <div class="title-sub">같은 색 고양이를 모아 포근하게 재워 주세요</div>
    <button id="btnStart">재우러 가기 🐾</button>
    <div class="title-ver">v0.4.2 · INTERNAL (저장 지원)</div>
  </div>
</div>


<header>
  <div class="hud-left">
    <span><span class="lv-label">LEVEL </span><span class="lv-num" id="lvNum">1</span></span>
    <span class="moves">이동 <b id="moveCount">0</b></span>
  </div>
  <div class="hud-right">
    <button class="icon-btn" id="btnSound"><img id="sndIcon" alt="소리"></button>
    <button class="icon-btn" id="btnRestart"><img id="rstIcon" alt="재시작"></button>
  </div>
</header>

<div class="tut" id="tut"></div>
<main id="board"></main>

<footer>
  <button class="tool" id="btnUndo"><img id="undoIcon" alt="">되돌리기</button>
  <button class="tool" id="btnHint"><img id="hintIcon" alt="">츄르 찬스<span class="adtag">AD 자리</span></button>
</footer>

<div id="finger">👆</div>

<div class="overlay" id="ovWin">
  <div class="panel">
    <img class="art" id="winArt" alt="">
    <h2>모두 새근새근 잠들었어요</h2>
    <p id="winStats"></p>
    <button class="btn" id="btnNext">다음 레벨 →</button>
  </div>
</div>

<div class="overlay" id="ovStuck">
  <div class="panel">
    <div class="big">🐈</div>
    <h2>고양이들이 갈 곳을 몰라요</h2>
    <p>괜찮아요, 고양이들은 급할 게 없대요.<br>천천히 다시 해볼까요?</p>
    <button class="btn" id="btnStuckUndo">한 수 되돌리기</button>
    <div class="ad-note">※ 정식 빌드에서는 보상형 광고 지점</div>
    <button class="btn ghost" id="btnStuckRestart">처음부터 다시</button>
  </div>
</div>

<div id="toast"></div>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function levelConfig(lv,rnd){
  const colors=Math.min(3+Math.floor((lv-1)/2),7);
  const caps=[];
  for(let i=0;i<colors;i++){ if(lv<3) caps.push(3); else caps.push([2,3,3,4][Math.floor(rnd()*4)]); }
  const empties = lv<6 ? [3,3] : (lv<10 ? [3,2] : [2,2]);
  return {caps, empties};
}
function isFullUniform(st,cap){return st.length===cap && st.every(c=>c===st[0])}
function topGroup(st){if(!st.length)return 0;const c=st[st.length-1];let n=0;for(let i=st.length-1;i>=0&&st[i]===c;i--)n++;return n}
function legalMoves(stacks,caps){
  const mv=[];
  for(let i=0;i<stacks.length;i++){
    const s=stacks[i];
    if(!s.length||isFullUniform(s,caps[i]))continue;
    const color=s[s.length-1], g=topGroup(s);
    for(let j=0;j<stacks.length;j++){
      if(i===j)continue;
      const d=stacks[j];
      if(isFullUniform(d,caps[j]))continue;
      const space=caps[j]-d.length;
      if(space<=0)continue;
      if(d.length&&d[d.length-1]!==color)continue;
      if(!d.length&&g===s.length)continue;
      mv.push([i,j,Math.min(g,space)]);
    }
  }
  return mv;
}
function isSolved(stacks,caps){return stacks.every((s,i)=>!s.length||isFullUniform(s,caps[i]))}
function keyOf(stacks,caps){return stacks.map((s,i)=>caps[i]+':'+s.join(',')).slice().sort().join('|')}
function solve(stacks,caps,nodeCap=60000){
  const visited=new Set();let nodes=0;
  function dfs(st,path){
    if(isSolved(st,caps))return path;
    if(++nodes>nodeCap)return null;
    const k=keyOf(st,caps);
    if(visited.has(k))return null;
    visited.add(k);
    const mv=legalMoves(st,caps);
    mv.sort((a,b)=>{
      const sc=m=>{const[i,j]=m;const d=st[j];const same=d.length&&st[i][st[i].length-1]===d[d.length-1];return (same?2:0)+(caps[j]-d.length===m[2]?1:0)};
      return sc(b)-sc(a);
    });
    for(const m of mv){
      const ns=st.map(s=>s.slice());
      const moved=ns[m[0]].splice(ns[m[0]].length-m[2],m[2]);
      ns[m[1]].push(...moved);
      const r=dfs(ns,path.concat([m]));
      if(r)return r;
    }
    return null;
  }
  return dfs(stacks,[]);
}
function generateLevel(lv){
  for(let attempt=0;attempt<60;attempt++){
    const rnd=mulberry32(lv*7919+attempt*104729+13);
    const cfg=levelConfig(lv,rnd);
    const cats=[];
    cfg.caps.forEach((cap,ci)=>{for(let k=0;k<cap;k++)cats.push(ci)});
    shuffle(cats,rnd);
    const stacks=[];let p=0;
    for(const cap of cfg.caps){stacks.push(cats.slice(p,p+cap));p+=cap}
    for(const _ of cfg.empties)stacks.push([]);
    const caps=cfg.caps.concat(cfg.empties);
    if(stacks.some((s,i)=>isFullUniform(s,caps[i])))continue;
    if(isSolved(stacks,caps))continue;
    const sol=solve(stacks.map(s=>s.slice()),caps);
    if(sol&&sol.length>=3)return{stacks,caps,par:sol.length};
  }
  return generateLevel(Math.max(1,lv-1));
}

let audioCtx=null,soundOn=true;
function blip(freq,dur=0.09,type='sine',vol=0.15){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function purr(){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),l=audioCtx.createOscillator(),lg=audioCtx.createGain();
    o.type='triangle';o.frequency.value=58;
    l.type='sine';l.frequency.value=13; lg.gain.value=22;
    l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.11,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.3);
    o.connect(g).connect(audioCtx.destination);
    o.start();l.start();o.stop(audioCtx.currentTime+1.3);l.stop(audioCtx.currentTime+1.3);
  }catch(e){}
}

  bad:()=>blip(180,0.12,'square',0.07),
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'sine',0.18),i*110));setTimeout(purr,500)},
};

let level=1, stacks=[], caps=[], par=0;
const SAVE_KEY='catnap_save_v1';
function saveProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({level,soundOn}))}catch(e){}}
function loadProgress(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&d.level>=1)return d}catch(e){}return null}
let selected=-1, moves=0, history=[], hintTimer=null;
let tutMoves=null, tutStep=0, tipShown=false;

const $=id=>document.getElementById(id);
const board=$('board');

/* ── 가로 배치 크기 계산 ──
   바구니 폭 = 고양이 폭 × (정원 × 0.92 + 0.5)
   고양이는 방석 위에 나란히 앉음. 새 고양이는 왼쪽부터 채우고, 맨 오른쪽부터 나감. */
function catWidth(){
  const n=caps.length;
  const vw=Math.min(window.innerWidth, 560);
  const base = n<=5 ? 58 : (n<=7 ? 54 : 48);
  const twoPerRow = Math.floor((vw-38)/(2*3.31));  // 정원3 바구니 2개/행 보장
  return Math.max(40, Math.min(base, twoPerRow));
}
function basketW(cap,cw){ return Math.round(cw*(cap*0.92+0.55)); }

function loadLevel(lv){
  const g=generateLevel(lv);
  stacks=g.stacks;caps=g.caps;par=g.par;
  selected=-1;moves=0;history=[];tipShown=false;
  saveProgress();
  $('lvNum').textContent=lv;
  $('moveCount').textContent='0';
  $('tut').innerHTML= lv===1
    ? `<strong>같은 색 고양이</strong>를 한 바구니에 모아 재워 주세요`
    : (lv===3 ? `바구니마다 <strong>방석 수</strong>가 달라요 — 어디에 재울지 배분이 전략!` : '');
  if(lv===1){ tutMoves = solve(stacks.map(s=>s.slice()),caps)?.slice(0,2) || null; tutStep=0; }
  else { tutMoves=null; hideFinger(); }
  render();
  if(tutMoves && !document.getElementById('titleScreen')) setTimeout(()=>fingerOn(tutMoves[0][0]),400);
}

function render(){
  clearHint();
  board.innerHTML='';
  const cw=catWidth();
  const catH=Math.round(cw/0.70);          // idle 종횡비
  const sleepW=Math.round(cw*1.28);        // sleep은 옆으로 김
  stacks.forEach((s,i)=>{
    const cap=caps[i], bw=basketW(cap,cw);
    const backAsp={2:273/321,3:273/461,4:275/589}[cap];
    const bkBackH=Math.round(bw*backAsp);
    const bkFrontH=Math.round(bkBackH*0.46);
    const locked=isFullUniform(s,cap);
    const b=document.createElement('div');
    b.className='basket';
    if(locked)b.classList.add('locked');
    if(i===selected)b.classList.add('sel');
    b.style.width=bw+'px';
    b.style.height=Math.max(bkBackH, catH+Math.round(bkFrontH*0.5))+'px';

    const back=document.createElement('img');
    back.className='bk-back';back.src=A['basket_'+cap+'_back'];b.appendChild(back);

    // 방석 슬롯 x 중심 (안쪽 8% 여백, 균등)
    const inner=bw*0.86, x0=bw*0.07;
    const slotW=inner/cap;
    const g=topGroup(s);
    s.forEach((c,idx)=>{
      const isSleep=locked;
      const w=isSleep?sleepW:cw;
      const cat=document.createElement('div');
      cat.className='cat';
      cat.style.width=w+'px';
      cat.style.left=Math.round(x0+slotW*(idx+0.5)-w/2)+'px';
      cat.style.bottom=Math.round(bkFrontH*(isSleep?0.95:0.48))+'px';
      cat.style.zIndex=10+idx;
      if(!locked && i===selected && idx>=s.length-g) cat.classList.add('top-sel');
      const img=document.createElement('img');
      img.src=A['cat_'+COLORS[c]+'_'+(isSleep?'sleep':'idle')];
      img.draggable=false;
      cat.appendChild(img);
      b.appendChild(cat);
    });

    const front=document.createElement('img');
    front.className='bk-front';front.src=A['basket_'+cap+'_front'];
    front.style.height=bkFrontH+'px';
    b.appendChild(front);

    if(locked){
      const z=document.createElement('span');z.className='zzz';z.textContent='Z z';b.appendChild(z);
    }
    b.addEventListener('pointerdown',()=>tapBasket(i,b));
    board.appendChild(b);
  });
  markTargets();
}

function markTargets(){
  const els=[...board.children];
  els.forEach(el=>el.classList.remove('can','dim'));
  if(selected===-1)return;
  const s=stacks[selected], color=s[s.length-1];
  els.forEach((el,j)=>{
    if(j===selected)return;
    const d=stacks[j];
    if(isFullUniform(d,caps[j])){el.classList.add('dim');return}
    const space=caps[j]-d.length;
    const ok = space>0 && (!d.length||d[d.length-1]===color);
    el.classList.add(ok?'can':'dim');
  });
}

function tapBasket(i,el){
  if(isFullUniform(stacks[i],caps[i])){toast('이미 새근새근 자고 있어요 💤');return}
  if(selected===-1){
    if(!stacks[i].length){toast('빈 바구니예요 — 고양이가 있는 곳을 먼저!');shakeEl(el);return}
    selected=i;sfx.pick();render();
    if(level===1&&!tipShown){toast('맨 오른쪽 친구부터 옮길 수 있어요 🐾');tipShown=true}
    advanceTut(1,i);
    return;
  }
  if(selected===i){selected=-1;render();return}
  attemptMove(selected,i,el);
}

function attemptMove(from,to,el){
  const s=stacks[from],d=stacks[to];
  const color=s[s.length-1],g=topGroup(s),space=caps[to]-d.length;
  if(space<=0){toast('이 바구니는 방석이 다 찼어요!');shakeEl(el);sfx.bad();selected=-1;render();return}
  if(d.length&&d[d.length-1]!==color){toast('색이 다른 친구 옆엔 안 앉는대요 🐾');shakeEl(el);sfx.bad();selected=-1;render();return}
  history.push({stacks:stacks.map(x=>x.slice()),moves});
  const m=Math.min(g,space);
  const movedCats=s.splice(s.length-m,m);
  d.push(...movedCats);
  moves++;$('moveCount').textContent=moves;
  selected=-1;
  const nowLocked=isFullUniform(d,caps[to]);
  nowLocked?sfx.lock():sfx.move();
  render();
  const bEl=board.children[to];
  if(bEl){[...bEl.querySelectorAll('.cat')].slice(-m).forEach(c=>c.classList.add('pop'))}
  advanceTut(2,to);
  checkEnd();
}

function fingerOn(basketIdx){
  const el=board.children[basketIdx];
  if(!el)return;
  const r=el.getBoundingClientRect();
  const f=$('finger');
  f.style.display='block';
  f.style.left=(r.left+r.width/2)+'px';
  f.style.top=(r.top+r.height*0.5)+'px';
}
function hideFinger(){$('finger').style.display='none'}
function advanceTut(phase,idx){
  if(!tutMoves||tutStep>=tutMoves.length)return;
  const [src,dst]=tutMoves[tutStep];
  if(phase===1){
    if(idx===src){fingerOn(dst)} else hideFinger();
  }else{
    tutStep++;
    hideFinger();
    if(tutStep<tutMoves.length){
      const sol=solve(stacks.map(s=>s.slice()),caps);
      if(sol&&sol.length){tutMoves=[sol[0]];tutStep=0;setTimeout(()=>fingerOn(sol[0][0]),350)}
      else tutMoves=null;
    }else tutMoves=null;
  }
}

function shakeEl(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),320)}

function checkEnd(){
  if(isSolved(stacks,caps)){
    sfx.win();hideFinger();
    $('winStats').innerHTML=`이동 <b>${moves}</b>수 · 참고 최단 ${par}수<br>골골골… 🐾`;
    setTimeout(()=>$('ovWin').classList.add('show'),900);
    return;
  }
  if(legalMoves(stacks,caps).length===0){
    setTimeout(()=>$('ovStuck').classList.add('show'),400);
  }
}

function undo(){
  if(!history.length){toast('되돌릴 수가 없어요');return}
  const h=history.pop();
  stacks=h.stacks;moves=h.moves;
  $('moveCount').textContent=moves;selected=-1;
  $('ovStuck').classList.remove('show');
  render();
}
function hint(){
  const sol=solve(stacks.map(s=>s.slice()),caps);
  if(!sol||!sol.length){toast('여기서는 길이 없어요 — 되돌려 보세요');return}
  const[from,to]=sol[0];
  clearHint();
  const els=board.children;
  els[from]&&els[from].classList.add('hint-src');
  els[to]&&els[to].classList.add('hint-dst');
  toast('🍡 주황 빛 바구니에서 → 초록 빛 바구니로!');
  hintTimer=setTimeout(clearHint,2600);
}
function clearHint(){
  if(hintTimer){clearTimeout(hintTimer);hintTimer=null}
  [...board.children].forEach(el=>el.classList.remove('hint-src','hint-dst'));
}
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);
}

$('btnUndo').onclick=undo;
$('btnHint').onclick=hint;
$('btnRestart').onclick=()=>loadLevel(level);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());


document.getElementById('titleScreen').style.backgroundImage=`url(${A.title})`;
document.getElementById('btnStart').addEventListener('click',()=>{
  const t=document.getElementById('titleScreen');
  t.classList.add('hide');
  sfx.pick();
  setTimeout(()=>t.remove(),550);
  if(tutMoves) setTimeout(()=>fingerOn(tutMoves[0][0]),600);
});

$('btnNext').onclick=()=>{$('ovWin').classList.remove('show');level++;loadLevel(level)};
$('btnStuckUndo').onclick=()=>{$('ovStuck').classList.remove('show');undo()};
$('btnStuckRestart').onclick=()=>{$('ovStuck').classList.remove('show');loadLevel(level)};
$('btnSound').onclick=function(){soundOn=!soundOn;$('sndIcon').src=soundOn?A.icon_sound_on:A.icon_sound_off;saveProgress()};
window.addEventListener('resize',()=>{render(); if(tutMoves&&tutStep<tutMoves.length)fingerOn(tutMoves[tutStep][0])});

const _saved=loadProgress();
if(_saved){
  level=_saved.level;
  if(_saved.soundOn===false){soundOn=false;const si=$('sndIcon');if(si)si.src=A.icon_sound_off;}
  if(level>1){const bs=document.getElementById('btnStart');if(bs)bs.textContent='LEVEL '+level+' 이어하기 🐾';}
}
loadLevel(level);
</script>
</body>
</html>
